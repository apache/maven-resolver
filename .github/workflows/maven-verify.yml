name: Verify

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# allow single build per branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify
    uses: apache/maven-gh-actions-shared/.github/workflows/maven-verify.yml@v5
    with:
      # one Linux job first; the matrix only starts when it passes. master builds on JDK 21+, so the
      # shared default of 17 cannot be used here
      ff-run: true
      ff-jdk: '21'
      ff-site-run: false
      maven4-enabled: true
      maven4-version: '4.0.0-rc-7' # the same as maven4Version in the root POM
      verify-fail-fast: false
      jdk-matrix: '[ "21", "25", "26" ]'
      # every JDK and both Maven lines on Linux; Windows drops the middle JDK; macOS, the scarcest
      # runner class, keeps the newest JDK only
      matrix-exclude: >
        [
          {"os": "windows-latest", "jdk": "25"},
          {"os": "macos-latest", "jdk": "21"},
          {"os": "macos-latest", "jdk": "25"}
        ]
